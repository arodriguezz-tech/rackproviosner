[project]
name = "rack-provisioner-readiness-ui"
version = "3.0.0a1"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "ui: requires PySide6 and pytest-qt",
  "presenter: headless readiness presentation test",
]
