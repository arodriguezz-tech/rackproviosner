[project]
name="rack-provisioner-alpha-v3-test-lab"
version="3.0.0a1"
requires-python=">=3.11"
[project.optional-dependencies]
test=["pytest>=8"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra --strict-markers"
markers=["contract: event contract", "integration: multi-module integration"]
