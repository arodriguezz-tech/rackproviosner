[general]
startup_page = single_switch
default_baud = 9600
engineer_mode = false

[inventory]
enabled = false
policy = optional
enable_file_import = false
allow_csv = true
allow_json = true

[safety]
alpha_apply_enabled = false

[discovery]
serial_regex = (?im)^\s*(?:Serial Number|Serial|Service Tag)\s*[:=]\s*([A-Za-z0-9._-]+)
mac_regex = (?im)^\s*(?:Base MAC Address|MAC Address|MAC)\s*[:=]\s*([0-9A-Fa-f]{2}(?::|-)[0-9A-Fa-f]{2}(?:(?::|-)[0-9A-Fa-f]{2}){4})
model_regex = (?im)^\s*(?:Product Name|Platform|Model)\s*[:=]\s*(.+?)\s*$
